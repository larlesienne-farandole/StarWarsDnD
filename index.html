<style>
@font-face{
  font-family:'Aurebesh AF';font-style:normal;font-weight:700;font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/LogicismDev/aurebesh-discord-font/fonts/AurebeshAF-Canon.woff2) format("woff2");
}
:root{
  --bg:#000000;
  --edge:rgba(255,255,255,.22);
  --white:#ffffff;
  --gray:#b9bcbe;
  --dim:#7e8285;
  --gold:#ffb020;
  --gold-hi:#ffc74d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--gray);
  font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
}
.wrap{position:relative;z-index:2;max-width:1560px;margin:0 auto;padding:0 34px 70px}

/* top bar */
header{display:flex;align-items:center;gap:26px;padding:20px 0 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;padding-right:22px;border-right:1px solid var(--edge)}
.brand img{height:58px;width:auto;display:block}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  all:unset;cursor:pointer;padding:12px 26px;background:transparent;border:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gray);transition:background .12s,color .12s,border-color .12s,box-shadow .12s;
}
.tab:hover,.tab[aria-selected="true"]{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28),inset 0 0 26px rgba(255,176,32,.10)}
.tab:focus-visible{outline:1px solid var(--gold-hi);outline-offset:2px}
.tab .n{font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--dim);margin-left:9px;letter-spacing:.04em}
.tab[aria-selected="true"] .n,.tab:hover .n{color:var(--gold)}


/* images switch */
.imgtoggle{margin-left:auto;display:flex;align-items:center;gap:11px;
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--dim);user-select:none;cursor:pointer}
.imgtoggle:hover{color:var(--gold-hi)}
.swtrack{position:relative;display:inline-block;width:42px;height:23px;flex:none}
.swtrack input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.swtrack .swpill{position:absolute;inset:0;background:transparent;border:1px solid var(--edge);transition:border-color .14s,box-shadow .14s}
.swtrack .swpill::before{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;
  background:var(--dim);transition:transform .14s,background .14s}
.swtrack input:checked+.swpill{border-color:var(--gold);box-shadow:0 0 10px rgba(255,176,32,.35)}
.swtrack input:checked+.swpill::before{transform:translateX(19px);background:var(--gold-hi)}
.swtrack input:focus-visible+.swpill{outline:1px solid var(--gold-hi);outline-offset:2px}
body.images-on .tile .bgimg,body.images-on .pc .bgimg{opacity:1}

/* ---------- tiles (home + campaigns) ---------- */
.home{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:26px}
.camprow{display:grid;grid-template-columns:1fr;gap:8px;margin-top:26px}
.tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:flex-start;
  background:#000;border:1px solid var(--edge);padding:26px;text-align:left;cursor:pointer;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,background .14s;min-height:238px}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .14s;z-index:1;
  background:repeating-linear-gradient(to bottom,rgba(255,176,32,.07) 0 1px,transparent 1px 3px)}
.tile:hover,.tile:focus-visible{border-color:var(--gold);background:rgba(255,176,32,.07);
  box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(255,176,32,.28),inset 0 0 34px rgba(255,176,32,.10);outline:none}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
.tile:hover h3,.tile:focus-visible h3{color:var(--gold);text-shadow:0 0 18px rgba(255,176,32,.55)}
.tile:hover .aur,.tile:focus-visible .aur{color:var(--gold-hi);opacity:.75}
.tile:hover .foot,.tile:focus-visible .foot{color:var(--gold-hi);border-color:var(--gold)}
.tile:hover .when,.tile:focus-visible .when{color:var(--gold-hi)}
.tile .aur{font-family:'Aurebesh AF',sans-serif;font-size:12px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:5px;padding-right:230px;line-height:1.5;min-height:1.5em;transition:color .14s}
.tile h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1;transition:color .14s,text-shadow .14s;font-size:30px}
.tile .eyebrow{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);font-weight:500;display:block;margin-top:6px}
.tile p{margin:12px 0 20px;font-size:14.5px;color:var(--gray);line-height:1.55;max-width:46ch}
.tile .foot{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);border-top:1px solid var(--edge);padding-top:9px;margin-top:auto;
  display:flex;justify-content:space-between;gap:14px;transition:color .14s,border-color .14s}
.tile .aur,.tile h3,.tile .eyebrow,.tile p,.tile .foot,.tile .when{position:relative;z-index:2}
.tags{position:absolute;top:22px;right:26px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:3}
.tag{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);padding:3px 10px;white-space:nowrap}

/* the next-session tile */
.home .feature{grid-row:span 3;min-height:420px;justify-content:flex-end}
.home .tile:not(.feature){justify-content:flex-end}   /* side tiles: text sits at the bottom too */
.camprow .tile{justify-content:flex-end}
.camprow .tile p{margin-bottom:0}
.home .feature h3{font-size:44px}
.home .feature p{font-size:16px}
.when{display:block;margin-top:14px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;
  font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--white);line-height:1.15;transition:color .14s}
.when small{display:block;font-weight:600;font-size:15px;letter-spacing:.16em;color:var(--dim);margin-top:4px}

/* tile background image (hover only) */
.tile .bgimg,.pc .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .18s;pointer-events:none;z-index:0}
.tile .bgimg::after,.pc .bgimg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,#000 0%,rgba(0,0,0,.94) 28%,rgba(0,0,0,.62) 58%,rgba(0,0,0,.30) 100%)}
.tile:hover .bgimg,.tile:focus-visible .bgimg,.pc:hover .bgimg,.pc:focus-visible .bgimg{opacity:1}

/* ---------- groups ---------- */
.groups{margin-top:26px;display:flex;flex-direction:column;gap:54px}
.sheetview .groups{margin-top:34px}
.grouphead{border-bottom:1px solid var(--edge);padding-bottom:11px;margin-bottom:14px}
.grouphead h2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:22px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--white);margin:0}
.sheetview .grouphead h2{font-size:22px;letter-spacing:.18em}

/* ---------- portrait cards (characters + sessions) ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.pc{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;cursor:pointer;aspect-ratio:3/4;min-height:280px;
  border:1px solid var(--edge);background:#000;
  transition:border-color .14s,box-shadow .14s}
.pc:hover,.pc:focus-visible{border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(255,176,32,.28)}
.pc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .14s;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(255,176,32,.07) 0 1px,transparent 1px 3px)}
.pc:hover::after,.pc:focus-visible::after{opacity:1}
.pc .txt{position:relative;z-index:3;padding:0 16px 15px}
.pc .aur{font-family:'Aurebesh AF',sans-serif;font-size:11px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:5px;line-height:1.5;transition:color .14s;padding-right:0}
.pc:hover .aur{color:var(--gold-hi);opacity:.8}
.pc h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1.02;transition:color .14s,text-shadow .14s}
.pc:hover h3,.pc:focus-visible h3{color:var(--gold);text-shadow:0 0 18px rgba(255,176,32,.55)}
.pc .eyebrow{display:block;margin-top:6px;font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.still{cursor:default}
.sheetview .pc .aur{font-size:11px;margin-bottom:5px;padding-right:0}
.sheetview .pc .eyebrow{font-size:12px;margin-top:6px;letter-spacing:.14em}

/* ---------- detail pages ---------- */
.detail{margin-top:26px}
.back{all:unset;cursor:pointer;padding:8px 18px;border:1px solid var(--edge);margin-bottom:8px;
  display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gray);
  transition:background .12s,color .12s,border-color .12s,box-shadow .12s}
.back:hover,.back:focus-visible{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28)}
.sheetview{border:1px solid var(--edge);background:#000;padding:38px 40px 34px;position:relative}
.sheetview .aur{font-family:'Aurebesh AF',sans-serif;font-size:14px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:8px;padding-right:120px;line-height:1.5}
.sheetview h2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:52px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1}
.sheetview .eyebrow{font-family:'Barlow Semi Condensed',sans-serif;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);font-weight:500;display:block;margin-top:10px}
.sheetview .lede{font-size:17px;color:var(--gray);line-height:1.6;margin:24px 0 0;max-width:70ch}
.sheetview .lede:empty{display:none}
body.editing .sheetview .lede:empty{display:block}
.flag{position:absolute;top:38px;right:40px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.blankslate{margin-top:34px;padding-top:26px;border-top:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-size:14px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}

/* ---------- campaign tiles ---------- */
.camprow .tile{min-height:310px}
.tile.still{cursor:default}
.camprow .addcard{aspect-ratio:auto;min-height:96px}
.gmrow{position:absolute;right:26px;bottom:26px;z-index:6;display:flex;align-items:center;gap:8px}
.gmicon{position:relative;display:block;flex:none;width:48px;height:48px}
.gmicon .bgimg{position:absolute;inset:0;border-radius:50%;background-size:contain;background-repeat:no-repeat;
  background-position:center;opacity:1!important}
.gmicon .bgimg::after{display:none}
body.editing .gmicon{cursor:pointer;outline:1px dashed rgba(255,176,32,.38);outline-offset:3px;border-radius:50%}
.gmx{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#000;border:1px solid var(--edge);
  color:var(--gray);font-size:13px;line-height:16px;text-align:center;cursor:pointer;z-index:2}
.gmx:hover{color:var(--gold-hi);border-color:var(--gold)}
.camprow .tile h3,.camprow .tile .aur{max-width:calc(100% - var(--gmw, 0px))}   /* clear of the GM icons */

/* footer prompt bar */
.prompt{display:flex;align-items:center;gap:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.prompt i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border:1px solid var(--edge);border-radius:50%;font-size:11px;color:var(--gray)}

@media(max-width:860px){
  .wrap{padding:0 14px 50px}
  header{gap:14px}
  .brand{border-right:none;padding-right:0}
  .brand img{height:44px}
  nav{width:100%;overflow-x:auto}
  .tab{padding:10px 16px;font-size:14px;white-space:nowrap}
  .tab .n{display:none}
  .home,.camprow{grid-template-columns:1fr}
  .home .feature{grid-row:auto;min-height:340px}
  .home .feature h3{font-size:34px}
  .tile{min-height:0}
  .tile .aur{padding-right:0}
  .roster{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .pc{min-height:0}
  .pc h3{font-size:18px}
  .sheetview{padding:24px}
  .sheetview h2{font-size:32px}
  .sheetview .aur{padding-right:0}
  .camprow .tile{min-height:240px}
  .gmrow{right:14px;bottom:14px}
  .gmicon{width:38px;height:38px}
  .flag{position:static;display:block;margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- edit mode ---------- */
.editbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 0;padding:12px 14px;
  border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.18)}
body.editing .editbar{display:flex}
.editflag{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);margin-right:auto}
.ebtn{all:unset;cursor:pointer;padding:9px 18px;border:1px solid var(--edge);background:transparent;
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gray);transition:background .12s,color .12s,border-color .12s,box-shadow .12s}
.ebtn:hover,.ebtn:focus-visible{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28)}
.ebtn.ghost{color:var(--dim)}
.ebtn[disabled]{opacity:.5;pointer-events:none}
.editbar input,.lock input,.tile .ein{background:transparent;border:1px solid var(--edge);color:var(--white);
  font-family:'Barlow',sans-serif;font-size:14px;padding:8px 11px;outline:none;color-scheme:dark}
.editbar input:focus,.lock input:focus,.tile .ein:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.editbar input{width:220px}
.pubform{display:contents}
.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;border:0!important;
  opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.tbtn{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--edge);background:#000;
  font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);transition:color .12s,border-color .12s}
.tbtn:hover,.tbtn:focus-visible{color:var(--gold-hi);border-color:var(--gold)}
.tools{display:none;position:absolute;top:12px;left:14px;z-index:5;gap:6px}
.tile .tools{top:22px;left:26px}
body.editing .tools{display:flex}
body.editing .tile{padding-top:64px}
.camprow .blankslate{margin-top:0;border-top:none;padding:6px 0}
body.editing .pc .txt{padding-top:40px}

/* every editable line: a faint dashed edge, solid gold while typing */
body.editing [data-f]{outline:1px dashed rgba(255,176,32,.38);outline-offset:3px;cursor:text;min-width:2ch;position:relative;z-index:4}
body.editing [data-f]:focus{outline:1px solid var(--gold);background:rgba(0,0,0,.6)}
body.editing [data-f]:empty{min-width:6ch;min-height:1em;display:inline-block}
.tile p:empty{display:none}
body.editing .tile p:empty{display:block}
body.editing .tags{z-index:5}
.tags .tag:empty{display:none}
body.editing .tags .tag:empty{display:inline-block}
.tile select.tag{background:#000;cursor:pointer;outline:none;color-scheme:dark}
.whenedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;position:relative;z-index:4}
.whenedit .ein{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;padding:6px 10px}
.whenedit small{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tile .urlrow{position:relative;z-index:4;margin-top:14px;display:none}
body.editing .tile .urlrow{display:block}
.tile .urlrow .ein{width:100%}
.addcard{all:unset;box-sizing:border-box;display:none;align-items:center;justify-content:center;aspect-ratio:3/4;min-height:280px;
  border:1px dashed var(--edge);cursor:pointer;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:color .12s,border-color .12s}
.addcard:hover,.addcard:focus-visible{color:var(--gold-hi);border-color:var(--gold)}
body.editing .addcard{display:flex}

/* unlock prompt */
.veil{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.86);
  align-items:flex-start;justify-content:center;padding:120px 18px}
.veil.open{display:flex}
.lock{width:100%;max-width:340px;background:#000;border:1px solid var(--edge);padding:20px}
.lock input{width:100%;font-size:15px;padding:10px 12px}
.lock .acts{display:flex;gap:6px;margin-top:10px}
.lock .ebtn{flex:1;text-align:center;padding:8px 0;font-size:13px}
.lockerr{margin:10px 0 0;font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);min-height:1em}
@media(max-width:860px){.editbar input{width:100%}}
.tbtn.grip{cursor:grab;-webkit-user-drag:element;user-select:none}
.dragging{opacity:.35}
.dropL{box-shadow:inset 4px 0 0 var(--gold),0 0 0 1px var(--gold)!important}
.dropR{box-shadow:inset -4px 0 0 var(--gold),0 0 0 1px var(--gold)!important}
.dropT{box-shadow:inset 0 4px 0 var(--gold),0 0 0 1px var(--gold)!important}
.dropB{box-shadow:inset 0 -4px 0 var(--gold),0 0 0 1px var(--gold)!important}
.prompt [data-f]{min-width:12ch}
.tile .foot{min-height:31px}
/* crop mode: the picture at full strength, everything else stands aside */
.cropping{cursor:move!important}
.cropping .bgimg{opacity:1!important}
.cropping .bgimg::after,.cropping::after{opacity:0!important}
.cropping > :not(.bgimg):not(.tools){visibility:hidden}
.cropping .tools{display:flex}
.cropping .tools .tbtn:not([data-crop]){display:none}
.cropping [data-crop]{color:var(--gold-hi);border-color:var(--gold)}

.mapview{margin-top:26px}
.mapview[hidden]{display:none}
.gm-frame{position:relative;border:1px solid var(--edge);background:#000;overflow:hidden;height:720px;min-height:460px}
.gm-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gm-svg.panning{cursor:grabbing}
.gm-svg.over-item{cursor:pointer}
.gm-svg.editing.over-item{cursor:move}
.gm-svg.over-vertex{cursor:move}
.gm-svg.tool-planet,.gm-svg.tool-route{cursor:crosshair}

/* map layers */
.gm-svg .pl text,.gm-svg .region text,.gm-svg .glab text,.gm-svg .gtitle text{pointer-events:none}
.gm-svg .planets text{font-family:'MapSans','DejaVu Sans',Verdana,sans-serif;fill:#fff;transition:opacity .15s}
.gm-svg .planets.nolabels text{display:none}
.gm-svg .pl .ring{fill:none;stroke:none}
.gm-svg .pl.hover text{fill:var(--gold-hi)}
.gm-svg .pl.sel text,.gm-svg .pl.hl text{fill:var(--gold-hi)}
.gm-svg .pl.sel .ring,.gm-svg .pl.hl .ring{stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 0 6px rgba(255,176,32,.9))}
.gm-svg .route{fill:none;stroke:#5da6ca;stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.gm-svg .route.c0{stroke-width:4.5}
.gm-svg .route.c1{stroke-width:8.5}
.gm-svg .route.c2{stroke-width:17}
.gm-svg .route.hover{stroke:#8fcbe8}
.gm-svg .route.sel,.gm-svg .route.hl{stroke:var(--gold);filter:drop-shadow(0 0 7px rgba(255,176,32,.75))}
.gm-svg .rlabels text{font-family:'MapSans','DejaVu Sans',Verdana,sans-serif;fill:#5ea9d0;transition:opacity .15s}
.gm-svg .rlabels text.hl{fill:var(--gold-hi)}
.gm-svg .region text{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.2em;fill:rgba(255,255,255,.6)}
.gm-svg .region.hover text,.gm-svg .region.sel text{fill:var(--gold-hi)}
.gm-svg .glab .au{font-family:'Aurebesh AF',sans-serif;fill:var(--dim)}
.gm-svg .gtitle .au{font-family:'Aurebesh AF',sans-serif;fill:var(--dim)}
.gm-svg .gtitle .h{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;fill:#fff;text-transform:uppercase;letter-spacing:.02em}
.gm-svg .gtitle .eb{font-family:'Barlow Semi Condensed',sans-serif;font-weight:500;fill:var(--dim);text-transform:uppercase;letter-spacing:.16em}
.gm-svg .gtitle .rule{stroke:var(--edge)}
.gm-svg .cellhl{fill:rgba(255,176,32,.07);stroke:var(--gold);filter:drop-shadow(0 0 8px rgba(255,176,32,.55))}
/* something is highlighted: everything else steps back */
.gm-svg.focus .route:not(.hl):not(.sel){opacity:.3}
.gm-svg.focus .rlabels text:not(.hl){opacity:.35}
.gm-svg.focus .pl:not(.hl):not(.on):not(.sel) text{opacity:.45}
.gm-svg .handles circle{fill:#000;stroke:var(--gold)}
.gm-svg .handles circle.end{fill:var(--gold)}
.gm-svg .draft{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-linejoin:round}
.gm-svg .marquee{fill:rgba(255,176,32,.08);stroke:var(--gold)}
.gm-svg .marquee.hidden{display:none}

/* overlays */
.gm-panel{position:absolute;background:rgba(0,0,0,.86);border:1px solid var(--edge);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3}
.gm-top{position:absolute;top:44px;left:44px;z-index:4;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 88px)}
.gm-search{position:relative;width:340px;max-width:100%}
.gm-search input{width:100%;background:rgba(0,0,0,.86);border:1px solid var(--edge);color:var(--white);
  font-family:'Barlow',sans-serif;font-size:14px;padding:10px 12px;outline:none;color-scheme:dark}
.gm-search input:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gm-search input::placeholder{color:var(--dim)}
.gm-results{position:absolute;top:calc(100% + 4px);left:0;right:0;display:none;max-height:340px;overflow:auto;background:#000;border:1px solid var(--edge);z-index:6}
.gm-results div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;cursor:pointer;color:var(--gray);font-size:14px}
.gm-results div.act,.gm-results div:hover{background:rgba(255,176,32,.08);color:var(--gold-hi)}
.gm-results small{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gm-chips{display:flex;flex-wrap:wrap;gap:6px;max-width:520px}
.gm-chips:empty{display:none}
.gm-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:4px 10px;background:rgba(0,0,0,.86);
  border:1px solid var(--gold);font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold-hi)}
.gm-chip b{font-weight:500;color:var(--dim)}
.gm-chip:hover b{color:var(--gold-hi)}
.gm-chip.clear{border-color:var(--edge);color:var(--dim)}
.gm-chip.clear:hover{border-color:var(--gold);color:var(--gold-hi)}
.gm-btn{all:unset;cursor:pointer;padding:7px 13px;border:1px solid var(--edge);background:rgba(0,0,0,.86);
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);
  transition:background .12s,color .12s,border-color .12s,box-shadow .12s;white-space:nowrap;text-align:center}
.gm-btn:hover,.gm-btn:focus-visible{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold)}
.gm-btn.on{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(255,176,32,.25)}
.gm-btn[disabled]{opacity:.35;pointer-events:none}
.gm-btn kbd{font-family:'Barlow',sans-serif;font-size:11px;color:var(--dim);margin-left:7px}
.gm-btn.on kbd,.gm-btn:hover kbd{color:var(--gold)}
.gm-edit{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--gold);background:rgba(0,0,0,.86);
  box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.18)}
.gm-frame.editing .gm-edit{display:flex}
.gm-edit .lbl{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 4px}
.gm-edit .sep{width:1px;align-self:stretch;background:var(--edge);margin:0 2px}
.gm-rtype{display:contents}
.gm-rtype.hidden .gm-btn{display:none}

.gm-card{top:44px;right:14px;width:310px;max-width:calc(100% - 88px);padding:20px;display:none;flex-direction:column;gap:12px;max-height:calc(100% - 120px);overflow:auto}
.gm-card.show{display:flex}
.gm-card .x{all:unset;position:absolute;top:12px;right:14px;cursor:pointer;color:var(--dim);font-size:22px;line-height:1}
.gm-card .x:hover{color:var(--gold-hi)}
.gm-card .aur{font-family:'Aurebesh AF',sans-serif;font-size:12px;color:var(--dim);letter-spacing:.06em;line-height:1.5;padding-right:20px;word-break:break-word}
.gm-card h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;
  color:var(--white);margin:-6px 0 0;line-height:1;word-break:break-word}
.gm-card .eyebrow{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-top:-4px}
.gm-card .eyebrow b{color:var(--gold-hi);font-weight:600}
.gm-card h4{margin:6px 0 0;padding-top:12px;border-top:1px solid var(--edge);font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.gm-list{display:flex;flex-direction:column}
.gm-list button{all:unset;flex:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);
  font-size:14px;color:var(--gray)}
.gm-list button:hover{color:var(--gold-hi)}
.gm-list button small{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.gm-card .muted{font-size:13px;color:var(--dim)}
.gm-card .hint{font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.gm-card textarea,.gm-card input[type=text],.gm-card input[type=number]{width:100%;background:transparent;border:1px solid var(--edge);color:#fff;
  font-family:'Barlow',sans-serif;font-size:14px;padding:8px 10px;outline:none;resize:vertical;color-scheme:dark}
.gm-card textarea:focus,.gm-card input:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gm-card .row{display:flex;gap:6px;flex-wrap:wrap}
.gm-card .row .gm-btn{flex:1;padding:7px 6px;font-size:12px}
.gm-card .danger:hover{color:#ff8a7a;border-color:#ff8a7a;background:rgba(255,80,60,.07);box-shadow:none}

.gm-readout{left:44px;bottom:14px;padding:6px 12px;display:flex;align-items:baseline;gap:10px;font-family:'Barlow Semi Condensed',sans-serif;
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);min-height:32px}
.gm-readout b{color:var(--white);font-weight:600;font-size:16px;letter-spacing:.08em}
.gm-readout .au{font-family:'Aurebesh AF',sans-serif;font-size:11px;letter-spacing:.06em}
.gm-corner{position:absolute;right:14px;bottom:14px;z-index:4;display:flex;gap:6px;align-items:flex-end}
.gm-zoom{display:flex;flex-direction:column}
.gm-zoom .gm-btn{padding:5px 0;width:40px;font-size:18px;letter-spacing:0}
.gm-zoom .gm-btn.fit{font-size:11px;letter-spacing:.12em;padding:8px 0}
.gm-zoom .gm-btn+.gm-btn{border-top:none}
.gm-menu{position:relative}
.gm-menu .drop{position:absolute;bottom:calc(100% + 6px);right:0;display:none;flex-direction:column;gap:2px;padding:8px 10px;background:#000;border:1px solid var(--edge);min-width:190px;z-index:6}
.gm-menu.open .drop{display:flex}
.gm-menu label{display:flex;align-items:center;gap:9px;padding:5px 2px;cursor:pointer;font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.gm-menu label:hover{color:var(--gold-hi)}
.gm-menu input{accent-color:var(--gold)}
.gm-rename{position:absolute;display:none;z-index:20;background:#000;border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(255,176,32,.3);
  color:#fff;font-family:'MapSans','DejaVu Sans',sans-serif;padding:3px 6px;outline:none;min-width:120px}
.gm-help{left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 28px));padding:22px 24px;display:none;z-index:8;max-height:calc(100% - 28px);overflow:auto}
.gm-help.show{display:block}
.gm-help h3{margin:0 0 12px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.gm-help table{width:100%;border-collapse:collapse;font-size:14px}
.gm-help td{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
.gm-help td:first-child{width:46%;color:#fff;font-family:'Barlow Semi Condensed',sans-serif;letter-spacing:.06em}
.gm-help .gm-btn{margin-top:14px}
@media(max-width:860px){
  .gm-search{width:100%}
  .gm-card{top:auto;bottom:62px;left:44px;right:14px;width:auto;max-height:46%}
  .gm-card h3{font-size:24px}
}

/* grid letters and numbers on the frame edges */
.gm-edges{position:absolute;inset:0;pointer-events:none;z-index:2}
.gm-strip{position:absolute;background:rgba(0,0,0,.94);overflow:hidden;
  font-family:'Aurebesh AF',sans-serif;font-size:12px;letter-spacing:.04em;color:var(--gray)}
.gm-strip.t,.gm-strip.b{left:0;right:0;height:30px}
.gm-strip.t{top:0;border-bottom:1px solid var(--edge)}
.gm-strip.b{bottom:0;border-top:1px solid var(--edge)}
.gm-strip.l,.gm-strip.r{top:0;bottom:0;width:30px}
.gm-strip.l{left:0;border-right:1px solid var(--edge)}
.gm-strip.r{right:0;border-left:1px solid var(--edge)}
.gm-strip span{position:absolute;display:flex;align-items:center;justify-content:center;transition:color .12s}
.gm-strip.t span,.gm-strip.b span{top:0;bottom:0;border-left:1px solid rgba(255,255,255,.08)}
.gm-strip.l span,.gm-strip.r span{left:0;right:0;border-top:1px solid rgba(255,255,255,.08);letter-spacing:.04em}
.gm-strip span.on{color:var(--gold-hi);background:rgba(255,176,32,.08);text-shadow:0 0 10px rgba(255,176,32,.6)}
.gm-edges .cn{position:absolute;width:30px;height:30px;background:#000;z-index:1}
.gm-edges .cn.tl{top:0;left:0;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.gm-edges .cn.tr{top:0;right:0;border-left:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.gm-edges .cn.bl{bottom:0;left:0;border-right:1px solid var(--edge);border-top:1px solid var(--edge)}
.gm-edges .cn.br{bottom:0;right:0;border-left:1px solid var(--edge);border-top:1px solid var(--edge)}

.gm-frame.noaxes .gm-top{top:14px;left:14px}
.gm-frame.noaxes .gm-card{top:14px}
.gm-frame.noaxes .gm-readout{left:14px}
</style>
</head>

/* ============================================================

   names are in the MAP block above; edit mode changes them and

const GalaxyMap = (() => {
  const RW = [4.5, 8.5, 17], NS = 'http://www.w3.org/2000/svg';
  const COLS = 'BCDEFGHIJKLMNOPQRSTUV', ROW0 = 1;
  const W = MAPDATA.W || 8000, H = MAPDATA.H || 7184;
  let host, frame, svg, world, L = {}, hooks = {}, ready = false, shown = false, dirty = false;
  const $ = s => host.querySelector(s);
  const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const r1 = v => Math.round(v*10)/10;
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const oneLine = s => String(s || '').replace(/\n/g, ' ');

  /* ---------- data ---------- */
  let P = new Map(), R = new Map(), G = new Map(), meta = {};
  function loadData(d){
    P = new Map(d.planets.map(p => [p.id, p]));
    R = new Map(d.routes.map(r => [r.id, r]));
    G = new Map((d.regions || []).map(g => [g.id, g]));
    meta = { v:d.v, rev:d.rev, n:d.n || 0 };
  }
  const dataOut = () => ({ v:1, rev:meta.rev, W, H, n:meta.n, planets:[...P.values()], routes:[...R.values()], regions:[...G.values()] });
  const nextId = n => { meta.n = (meta.n || 0) + 1; return n + 'x' + meta.n.toString(36); };

  /* ---------- camera (screen coordinates are relative to the frame) ---------- */
  let cam = { x:0, y:0, k:.1 }, vw = 800, vh = 600;
  const size = () => { vw = svg.clientWidth || 800; vh = svg.clientHeight || 600; };
  const loc = e => { const b = svg.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const toWorld = (sx, sy) => [(sx - cam.x)/cam.k, (sy - cam.y)/cam.k];
  const toScreen = (x, y) => [x*cam.k + cam.x, y*cam.k + cam.y];
  let EDGE = 30;   // the letter/number strips sit just outside the grid (0 when they're hidden)
  const minK = () => Math.max((vw - EDGE)/(BOX.x1 - BOX.x0), (vh - EDGE)/(BOX.y1 - BOX.y0));
  const fitK = minK;
  function clampCam(){
    const k = Math.max(minK(), Math.min(8, cam.k));
    cam.k = k;
    cam.x = Math.min(EDGE - BOX.x0*k, Math.max(vw - BOX.x1*k, cam.x));
    cam.y = Math.min(EDGE - BOX.y0*k, Math.max(vh - BOX.y1*k, cam.y));
  }
  function applyCam(){
    clampCam();
    edges();
    world.setAttribute('transform', `translate(${cam.x},${cam.y}) scale(${cam.k})`);
    if (selKind === 'r') drawHandles();
    if (draft.length) drawDraft();
  }
  function fit(){ size(); const k = minK(); cam = { k, x:(vw + EDGE - (BOX.x0 + BOX.x1)*k)/2, y:(vh + EDGE - (BOX.y0 + BOX.y1)*k)/2 }; applyCam(); }
  function zoomAt(sx, sy, f){
    const k = Math.max(minK(), Math.min(8, cam.k * f));
    const [wx, wy] = toWorld(sx, sy);
    cam = { k, x: sx - wx*k, y: sy - wy*k }; applyCam();
  }
  let flyAnim = null;
  function flyTo(x, y, k){
    cancelAnimationFrame(flyAnim);
    const a = { ...cam }, b = { k, x: vw/2 - x*k, y: vh/2 - y*k }, t0 = performance.now(), dur = 480;
    const step = t => {
      const u = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-u, 3);
      cam = { k: a.k + (b.k - a.k)*e, x: a.x + (b.x - a.x)*e, y: a.y + (b.y - a.y)*e }; applyCam();
      if (u < 1) flyAnim = requestAnimationFrame(step);
    };
    flyAnim = requestAnimationFrame(step);
  }
  function flyToBox(x0, y0, x1, y1){
    const pad = 120, w = Math.max(x1 - x0 + pad*2, 400), h = Math.max(y1 - y0 + pad*2, 400);
    flyTo((x0 + x1)/2, (y0 + y1)/2, Math.max(minK(), Math.min(2.2, Math.min(vw/w, vh/h))));
  }

  /* ---------- grid ---------- */
  const GRID = { ...MAPSTATIC.grid, ys: [...MAPSTATIC.grid.ys] };
  { const n = GRID.ys.length; GRID.ys.push(Math.round(GRID.ys[n-1]*2 - GRID.ys[n-2])); GRID.ys.unshift(Math.round(GRID.ys[0]*2 - GRID.ys[1])); }   // rows 21 and 1
  const BOX = { x0: GRID.xs[0], x1: GRID.xs[GRID.xs.length-1], y0: GRID.ys[0], y1: GRID.ys[GRID.ys.length-1] };
  function gridCell(x, y){
    let ci = -1, ri = -1;
    for (let i = 0; i < GRID.xs.length-1; i++) if (x >= GRID.xs[i] && x < GRID.xs[i+1]) ci = i;
    for (let j = 0; j < GRID.ys.length-1; j++) if (y >= GRID.ys[j] && y < GRID.ys[j+1]) ri = j;
    return ci < 0 || ri < 0 ? null : { ci, ri, name: COLS[ci] + '-' + (ri + ROW0) };
  }
  const cellName = (x, y) => (gridCell(x, y) || {}).name || '';

  /* ---------- static layers ---------- */
  function drawStatic(){
    el('rect', { x:0, y:0, width:W, height:H, fill:'#000' }, L.bands);
    MAPSTATIC.bands.forEach(b => el('path', { d:b.d, fill:b.c, 'fill-rule':'evenodd' }, L.bands));
    const g = GRID, line = { stroke:'rgba(255,255,255,.13)', 'stroke-width':1, 'vector-effect':'non-scaling-stroke' };
    g.xs.forEach(x => el('line', { x1:x, x2:x, y1:BOX.y0, y2:BOX.y1, ...line }, L.grid));
    g.ys.forEach(y => el('line', { x1:BOX.x0, x2:BOX.x1, y1:y, y2:y, ...line }, L.grid));
  }
  /* grid letters and numbers, pinned to the frame edges so they stay put while you zoom and pan */
  let edgeCols = [], edgeRows = [], edgeOn = { c:-1, r:-1 };
  function buildEdges(){
    const e = $('.gm-edges');
    e.innerHTML = ['t','l'].map(k => `<div class="gm-strip ${k}">${(k === 't'
      ? COLS.split('').slice(0, GRID.xs.length-1).map((c, i) => `<span data-c="${i}">${c.toLowerCase()}</span>`)
      : GRID.ys.slice(0, -1).map((_, j) => `<span data-r="${j}">${j + ROW0}</span>`)).join('')}</div>`).join('')
      + '<i class="cn tl"></i>';
    edgeCols = [...e.querySelectorAll('[data-c]')]; edgeRows = [...e.querySelectorAll('[data-r]')];
  }

  /* ---------- link: #map/Coruscant+Kessel Run ---------- */
  function writeHash(){
    const h = '#map' + (hl.length ? '/' + hl.map(x => encodeURIComponent(x.kind === 'r' && !x.name ? '' : x.name)).filter(Boolean).join('+') : '');
    if (location.hash !== h) try { history.replaceState(null, '', h); } catch(e) {}
  }
  function findByName(name){
    const n = norm(name);
    const cm = /^([b-v])-?(\d{1,2})$/i.exec(name.trim());
    if (cm){ const ci = COLS.indexOf(cm[1].toUpperCase()), ri = +cm[2] - ROW0; if (ci >= 0 && ri >= 0 && ri < GRID.ys.length-1) return cellItem(ci, ri); }
    for (const p of P.values()) if (norm(p.name) === n) return planetItem(p.id);

  }
  function fromHash(id){

    const xs = [], ys = [];
    for (const h of items){
      if (h.kind === 'p'){ const p = P.get(h.id); xs.push(p.x); ys.push(p.y); }
      else if (h.kind === 'r') h.pts.forEach(q => { xs.push(q[0]); ys.push(q[1]); });

    else flyToBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
  }

  /* ---------- search ---------- */
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  let found = [], act = 0;
  function search(){
    const qv = $('.gm-q').value, t = norm(qv), res = $('.gm-results');
    if (!t){ res.style.display = 'none'; return; }
    const out = [];
    const cm = /^\s*([b-v])\s*-?\s*(\d{1,2})\s*$/i.exec(qv);
    if (cm){ const ci = COLS.indexOf(cm[1].toUpperCase()), ri = +cm[2] - ROW0; if (ci >= 0 && ri >= 0 && ri < GRID.ys.length-1) out.push([cellItem(ci, ri), 'Grid square']); }
    const pl = [...P.values()].filter(p => p.name), routes = [];
    const seen = new Set();
    for (const r of R.values()) if (r.name && !seen.has(norm(r.name))){ seen.add(norm(r.name)); routes.push(r); }
    const rank = (name) => { const n = norm(name); return n.startsWith(t) ? 0 : n.includes(t) ? 1 : 2; };
    const cand = [...pl.map(p => [planetItem(p.id), cellName(p.x, p.y), rank(p.name)]), ...routes.map(r => [{ kind:'r', id:r.id, name:r.name, lazy:true }, 'Hyperspace route', rank(r.name)])]
      .filter(c => c[2] < 2).sort((a, b) => a[2] - b[2] || a[0].name.length - b[0].name.length);
    for (const c of cand.slice(0, 12)) out.push([c[0], c[1]]);
    found = out; act = 0;
    res.innerHTML = found.map(([it, sub], i) => `<div class="${i === act ? 'act' : ''}" data-i="${i}"><span>${esc(it.name)}</span><small>${esc(sub)}</small></div>`).join('') || '<div><span>Nothing charted by that name</span></div>';
    res.style.display = 'block';
  }
  function pick(i, add){
    let it = found[i] && found[i][0]; if (!it) return;
    if (it.lazy) it = routeItem(it.id);
    $('.gm-results').style.display = 'none'; $('.gm-q').blur();
    if (editing){ if (it.kind === 'p') setSel('p', [it.id]); else if (it.kind === 'r') setSel('r', it.ids); showItem(it); return; }
    setHL([it], add); showItem(it);
  }

  /* ---------- edit mode: selection, undo, operations ---------- */
  let editing = false, sel = new Set(), selKind = null;
  function setSel(kind, ids, add=false){

    if (!sel.size) selKind = null;

  const clearSel = () => setSel(null, []);
  function drawHandles(){
    L.handles.textContent = '';

    const rad = 5/cam.k, sw = 2/cam.k;
    for (const id of sel){ const r = R.get(id); if (!r) continue;
      r.p.forEach((q, i) => el('circle', { cx:q[0], cy:q[1], r:rad, 'stroke-width':sw, class:(i === 0 || i === r.p.length-1) ? 'end' : '' }, L.handles)); }
  }

  function attachedVertices(pids){
    const out = [];

      for (const [rid, i] of near(sIdx, p.x, p.y, 12)){ const r = R.get(rid);
        for (const j of [i, i+1]) if (Math.hypot(r.p[j][0]-p.x, r.p[j][1]-p.y) < 9 && !out.some(o => o[0] === rid && o[1] === j)) out.push([rid, j]); } }

  function addPlanet(x, y){

  /* inline rename */

  }

  /* inspector (edit mode) */
  function inspector(){
    const c = $('.gm-card');

    c.classList.add('show');
    if (selKind === 'p' && sel.size === 1){
      const p = P.get([...sel][0]);

        <textarea data-i="name" rows="2" spellcheck="false">${esc(p.name)}</textarea>
        <h4>Name position</h4>
        <div class="row"><button class="gm-btn" data-side="l">Left</button><button class="gm-btn" data-side="r">Right</button><button class="gm-btn" data-side="t">Above</button><button class="gm-btn" data-side="b">Below</button></div>
        <h4>Name size</h4><input data-i="size" type="number" min="8" max="80" step="1" value="${p.fs}">

    } else if (selKind === 'p'){

        <button class="gm-btn danger" data-i="del">Delete ${sel.size} planets</button>`;
    } else if (selKind === 'r'){

      const cls = rs.every(r => (r.c|0) === (rs[0].c|0)) ? (rs[0].c|0) : -1;
      c.innerHTML = `<h4 style="border:0;padding:0;margin:0">${sel.size === 1 ? 'Route section' : sel.size + ' route sections'}</h4>

  function wireInspector(){

    }

      const nl = (p.name || '').split('\n').length, lh = p.lh || p.fs*1.15, half = (nl-1)*lh/2;
      ({ l:() => { p.a='e'; p.ax=-10; p.ay=r1(p.fs*.36 - half); }, r:() => { p.a='s'; p.ax=10; p.ay=r1(p.fs*.36 - half); },
         t:() => { p.a='m'; p.ax=0; p.ay=r1(-12 - (nl-1)*lh); }, b:() => { p.a='m'; p.ax=0; p.ay=r1(10 + p.fs*.76); } })[b.dataset.side]();

  /* ---------- tools ---------- */

  /* ---------- pointer ---------- */
  function onDown(e){

    svg.setPointerCapture(e.pointerId);

    if (pointers.size === 2){ const [a, b] = [...pointers.values()]; drag = { type:'pinch', d:Math.hypot(a[0]-b[0], a[1]-b[1]), m:[(a[0]+b[0])/2, (a[1]+b[1])/2] }; return; }
    const [sx, sy] = loc(e), [x, y] = toWorld(sx, sy);

    if (editing && tool === 'route'){ drag = { type:'click-route', sx:e.clientX, sy:e.clientY, x, y }; return; }
    const h = hit(sx, sy);

      if (!group.some(g => g[0] === h.id && g[1] === h.i)) group.push([h.id, h.i]);

/* ---------- time: the session is typed in one zone, shown in the viewer's ---------- */
function zoneOffset(ms, zone){
  const f = new Intl.DateTimeFormat('en-US', {timeZone:zone, hour12:false, year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value);
  return Date.UTC(+o.year, o.month-1, +o.day, +o.hour % 24, +o.minute, +o.second) - Math.floor(ms/1000)*1000;
}
function sessionMs(){
  const n = SITE.next, d = /^(\d{4})-(\d\d)-(\d\d)$/.exec(n.date||''), t = /^(\d\d):(\d\d)$/.exec(n.time||'');
  if (!d || !t) return NaN;
  const want = Date.UTC(+d[1], d[2]-1, +d[3], +t[1], +t[2]);
  let g = want;
  try { for (let i = 0; i < 3; i++) g = want - zoneOffset(g, n.tz || 'UTC'); } catch(e) {}
  return g;
}
function endMs(){
  const s = sessionMs(), m = /^(\d\d):(\d\d)$/.exec(SITE.next.end || ''), t = /^(\d\d):(\d\d)$/.exec(SITE.next.time || '');
  if (isNaN(s) || !m || !t) return NaN;
  let mins = (+m[1]*60 + +m[2]) - (+t[1]*60 + +t[2]);
  if (mins <= 0) mins += 24*60;                     // runs past midnight
  return s + mins * 60000;
}
function zoneName(){
  try { return new Intl.DateTimeFormat('en-US', {timeZone:SITE.next.tz, timeZoneName:'short'})
    .formatToParts(new Date(sessionMs() || Date.now())).find(p => p.type === 'timeZoneName').value } catch(e) { return SITE.next.tz }
}

// "6:00 PM – 9:00 PM PST", in the viewer's own zone
function timeRange(ms){
  const t = (x, z) => new Date(x).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit', ...(z ? {timeZoneName:'short'} : {})});
  const e = endMs();
  return isNaN(e) ? t(ms, true) : `${t(ms)} \u2013 ${t(e, true)}`;
}

/* ---------- crop: drag the picture inside its frame ---------- */
function toggleCrop(btn){
  const host = btn.closest('.tile,.pc'), frame = host && host.querySelector('.bgimg')?.parentElement;
  if (!frame) return;
  const on = !frame.classList.contains('cropping');
  view.querySelectorAll('.cropping').forEach(c => { c.classList.remove('cropping'); });
  view.querySelectorAll('[data-crop]').forEach(b => b.textContent = 'Crop');
  if (!on) return;
  frame.classList.add('cropping');
  btn.textContent = 'Done';
}
let crop = null;
view.addEventListener('pointerdown', e => {
  const card = e.target.closest('.cropping'); if (!card || e.target.closest('.tools')) return;
  const layer = card.querySelector('.bgimg'); if (!layer) return;
  e.preventDefault();
  const m = /url\(["']?(.*?)["']?\)/.exec(layer.style.backgroundImage);
  const im = new Image(); im.src = m ? m[1] : '';
  const [px, py] = (layer.style.backgroundPosition || '50% 50%').split(' ').map(v => v === 'center' ? 50 : parseFloat(v));
  crop = { layer, im, x: e.clientX, y: e.clientY, px: isNaN(px) ? 50 : px, py: isNaN(py) ? 50 : py };
  card.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', e => {
  if (!crop) return;
  const { layer, im } = crop;
  const W = layer.clientWidth, H = layer.clientHeight;
  const iw = im.naturalWidth || W, ih = im.naturalHeight || H;
  const sc = Math.max(W / iw, H / ih);                 // background-size: cover
  const spareX = iw * sc - W, spareY = ih * sc - H;    // how far the picture can travel
  const nx = spareX > 1 ? crop.px - (e.clientX - crop.x) / spareX * 100 : 50;
  const ny = spareY > 1 ? crop.py - (e.clientY - crop.y) / spareY * 100 : 50;
  const cl = v => Math.max(0, Math.min(100, Math.round(v * 10) / 10));
  layer.style.backgroundPosition = `${cl(nx)}% ${cl(ny)}%`;
});
const endCrop = () => {
  if (!crop) return;
  setAt(crop.layer.dataset.src + 'Pos', crop.layer.style.backgroundPosition);
  crop = null; markDirty();
};
view.addEventListener('pointerup', endCrop);
view.addEventListener('pointercancel', endCrop);

/* ---------- drag to reorder: grab a card by its Move button ---------- */
let dragFrom = null, justDropped = false;
const VERTICAL = ['campaigns', 'home.order'];
const clearDrop = () => view.querySelectorAll('.dropL,.dropR,.dropT,.dropB').forEach(x => x.classList.remove('dropL','dropR','dropT','dropB'));
function dropSide(el, e, list){
  const r = el.getBoundingClientRect();
  return VERTICAL.includes(list) ? (e.clientY - r.top > r.height / 2) : (e.clientX - r.left > r.width / 2);
}
function moveItem(list, from, to){
  if (list === 'campaigns'){
    const keys = Object.keys(SITE.campaigns), old = SITE.campaigns;
    keys.splice(to, 0, keys.splice(from, 1)[0]);
    SITE.campaigns = Object.fromEntries(keys.map(k => [k, old[k]]));
  } else {
    const arr = getAt(list); arr.splice(to, 0, arr.splice(from, 1)[0]);
  }
}
// the Move button is the handle; the whole card travels with it
view.addEventListener('dragstart', e => {
  if (!editing()) return;
  const g = e.target.closest && e.target.closest('[data-grip]');
  if (!g){ e.preventDefault(); return; }      // no stray link or text drags while editing
  const it = g.closest('[data-drag]');
  dragFrom = it.dataset.drag; it.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragFrom); e.dataTransfer.setDragImage(it, 30, 30); } catch(err) {}
});
view.addEventListener('dragover', e => {
  if (!dragFrom) return;
  const it = e.target.closest('[data-drag]'); if (!it) return;
  const list = dragFrom.split('|')[0];
  if (it.dataset.drag.split('|')[0] !== list || it.dataset.drag === dragFrom) { clearDrop(); return; }
  // (campaign tiles may cross between Ongoing and Upcoming)
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const after = dropSide(it, e, list), v = VERTICAL.includes(list);
  clearDrop(); it.classList.add(v ? (after ? 'dropB' : 'dropT') : (after ? 'dropR' : 'dropL'));
});
view.addEventListener('drop', e => {
  if (!dragFrom) return;
  const it = e.target.closest('[data-drag]'); e.preventDefault();
  const [list, f] = dragFrom.split('|'), from = +f;
  if (it && it.dataset.drag.split('|')[0] === list){
    let to = +it.dataset.drag.split('|')[1] + (dropSide(it, e, list) ? 1 : 0);
    if (from < to) to--;
    if (list === 'campaigns' && it.dataset.group){
      const key = Object.keys(SITE.campaigns)[from];
      if (SITE.campaigns[key].status !== it.dataset.group){ SITE.campaigns[key].status = it.dataset.group; markDirty(); }
    }
    if (to !== from){ moveItem(list, from, to); markDirty(); }
  }
  dragFrom = null; justDropped = true; setTimeout(() => justDropped = false, 50);
  render();
});
view.addEventListener('dragend', () => {
  dragFrom = null; clearDrop();
  view.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
});

const imgPick = document.getElementById('imgPick');
function pickImage(path){ imgTarget = path; imgPick.value = ''; imgPick.click(); }
imgPick.onchange = () => {
  const f = imgPick.files[0]; if (!f || !imgTarget) return;
  const im = new Image();
  im.onload = () => {
    const sc = Math.min(1, 1400 / im.width), c = document.createElement('canvas');
    c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const png = /\.gms\.\d+\.img$/.test(imgTarget) || f.type === 'image/png';
    setAt(imgTarget, png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .82));
    setAt(imgTarget + 'Pos', '');
    URL.revokeObjectURL(im.src); markDirty(); render();
  };
  im.src = URL.createObjectURL(f);
};

/* ---------- unlock: Ctrl + Shift + E ---------- */
const veil = document.getElementById('veil');
async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function closeVeil(){ veil.classList.remove('open'); veil.innerHTML = ''; }
function promptUnlock(){
  if (editing()) return;
  veil.innerHTML = `<div class="lock">
    <input type="password" id="pw" autocomplete="off" aria-label="Password">
    <div class="acts"><button class="ebtn" id="pwGo">Unlock</button><button class="ebtn ghost" id="pwNo">Cancel</button></div>
    <p class="lockerr" id="pwErr"></p></div>`;
  veil.classList.add('open');
  const pw = document.getElementById('pw'); pw.focus();
  const tryIt = async () => {
    if (await sha256(pw.value) === PASS_HASH){ document.body.classList.add('editing'); closeVeil(); render(); recallToken(); }
    else document.getElementById('pwErr').textContent = 'Password not recognised.';
  };
  document.getElementById('pwGo').onclick = tryIt;
  document.getElementById('pwNo').onclick = closeVeil;
  pw.onkeydown = e => { if (e.key === 'Enter') tryIt(); };
}
veil.addEventListener('mousedown', e => { if (e.target === veil) closeVeil(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeVeil();
  if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')){ e.preventDefault(); promptUnlock(); }
});
document.getElementById('lockBtn').onclick = () => {
  if (dirty && !confirm('There are unpublished changes. Lock anyway? They stay on this page until you reload.')) return;
  document.body.classList.remove('editing'); render();
};
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- saving ---------- */
function buildFile(){
  const a = SRC.indexOf('/*DATA*/'), b = SRC.indexOf('/*END DATA*/');
  if (a < 0 || b < 0) throw new Error('Could not find the data block in the page.');
  const clean = t => t.replace(/<script[^>]*src="(?:chrome|moz|safari-web)-extension:[^"]*"[^>]*><\/script>/g, '');
  let out = clean(SRC.slice(0, a)) + '/*DATA*/\nconst SITE = ' + JSON.stringify(SITE, null, 2) + ';\n' + clean(SRC.slice(b));
  if (GalaxyMap.dirty){
    const m1 = out.indexOf('/*MAP*/'), m2 = out.indexOf('/*END MAP*/');
    if (m1 < 0 || m2 < 0) throw new Error('Could not find the map block in the page.');
    out = out.slice(0, m1) + '/*MAP*/\nconst MAPDATA = ' + GalaxyMap.json() + ';\n' + out.slice(m2);
  }
  return out;
}
document.getElementById('dlBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildFile()], {type:'text/html'}));
  a.download = 'index.html'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

const tokIn = document.getElementById('tok');
tokIn.value = sessionStorage.getItem('ghToken') || '';
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
async function commit(tok, path, content, message){
  const api = `https://api.github.com/repos/${REPO}/contents/${path}`;
  const h = {Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json'};
  let sha = null;
  const meta = await fetch(`${api}?ref=${BRANCH}`, {headers: h});
  if (meta.ok) sha = (await meta.json()).sha;
  else if (meta.status !== 404) throw new Error(`GitHub refused the token (${meta.status}).`);
  const put = await fetch(api, {method:'PUT', headers:h, body: JSON.stringify({message, content, branch:BRANCH, ...(sha ? {sha} : {})})});
  if (!put.ok){ let d = ''; try { d = (await put.json()).message } catch(e) {} throw new Error(`Could not save ${path} (${put.status}) ${d}`); }
}
// any picked image still living inside the page is moved out to images/
function embeddedImages(){
  const out = [], slug = s => String(s||'image').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'image';
  (function walk(o, path){
    for (const k in o){
      const v = o[k], p = path ? path + '.' + k : k;
      if (typeof v === 'string' && v.startsWith('data:image/')) {
        const hint = o.name || o.title || path.split('.').filter(x => isNaN(x)).pop() || 'image';
        const ext = v.startsWith('data:image/png') ? 'png' : 'jpg';
        out.push({p, data: v, file: `images/${slug(hint)}-${k === 'portrait' ? 'portrait' : k}-${Date.now().toString(36)}${out.length}.${ext}`});
      } else if (v && typeof v === 'object') walk(v, p);
    }
  })(SITE, '');
  return out;
}
// ask the browser's password manager for the saved token (Chrome, Edge); other browsers autofill the field
async function recallToken(){
  if (tokIn.value || !window.PasswordCredential || !navigator.credentials) return;
  try {
    const c = await navigator.credentials.get({ password: true, mediation: 'optional' });
    if (c && c.password) tokIn.value = c.password;
  } catch(e) {}
}
async function rememberToken(tok){
  sessionStorage.setItem('ghToken', tok);
  if (!window.PasswordCredential || !navigator.credentials) return;
  try { await navigator.credentials.store(new PasswordCredential({ id: 'GitHub token', password: tok, name: 'GitHub token' })); } catch(e) {}
}
document.getElementById('pubForm').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('pubBtn'), flag = document.getElementById('editFlag');
  const tok = tokIn.value.trim();
  if (!tok){ tokIn.focus(); flag.textContent = 'Paste your GitHub token first'; return; }
  btn.disabled = true;
  try {
    const imgs = embeddedImages();
    for (let i = 0; i < imgs.length; i++){
      flag.textContent = `Uploading image ${i+1} of ${imgs.length}…`;
      await commit(tok, imgs[i].file, imgs[i].data.split(',')[1], 'Add image');
      setAt(imgs[i].p, imgs[i].file);
    }
    flag.textContent = 'Saving page…';
    await commit(tok, FILE_PATH, b64(new TextEncoder().encode(buildFile())), 'Update site');
    await rememberToken(tok);
    dirty = false; flag.textContent = 'Published · live in about a minute';
  } catch(err){ flag.textContent = err.message; }
  btn.disabled = false;
};

/* ---------- aurebesh scramble on hover ---------- */
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function scramble(el){
  if (reduced || editing() || el.dataset.busy) return;
  const target = el.dataset.text || el.textContent;
  el.dataset.text = target; el.dataset.busy = "1";
  const len = target.length; let frame = 0;
  const settle = target.split('').map((_,i) => 6 + Math.floor(i*1.6 + Math.random()*6));
  const held = target.split('').map(() => GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
  el._scr = setInterval(() => {
    let out = '';
    for (let i = 0; i < len; i++){
      const ch = target[i];
      if (ch === ' ' || frame >= settle[i]){ out += ch; continue }
      if (frame % 4 === 0) held[i] = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      out += held[i];
    }
    el.textContent = out;
    if (frame++ > Math.max(...settle)) stopScramble(el);
  }, 35);
}
function stopScramble(el){
  if (!el || !el._scr) return;
  clearInterval(el._scr); el._scr = null;
  el.textContent = el.dataset.text || el.textContent;
  delete el.dataset.busy;
}
view.addEventListener('mouseover', e => {
  const c = e.target.closest('.tile,.pc'); if (!c || c.contains(e.relatedTarget)) return;
  const a = c.querySelector('.aur'); if (a) scramble(a);
});
view.addEventListener('mouseout', e => {
  const c = e.target.closest('.tile,.pc'); if (!c || c.contains(e.relatedTarget)) return;
  stopScramble(c.querySelector('.aur'));
});

imgToggle.addEventListener('change', e => document.body.classList.toggle('images-on', e.target.checked));
