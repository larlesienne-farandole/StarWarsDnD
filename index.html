<style>
@font-face{
  font-family:'Aurebesh AF';font-style:normal;font-weight:700;font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/LogicismDev/aurebesh-discord-font/fonts/AurebeshAF-Canon.woff2) format("woff2");
}
:root{
  --bg:#000000;
  --edge:rgba(255,255,255,.22);
  --white:#ffffff;
  --gray:#b9bcbe;
  --dim:#7e8285;
  --gold:#ffb020;
  --gold-hi:#ffc74d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--gray);
  font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
}
.wrap{position:relative;z-index:2;max-width:1560px;margin:0 auto;padding:0 34px 70px}

/* top bar */
header{display:flex;align-items:center;gap:26px;padding:20px 0 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;padding-right:22px;border-right:1px solid var(--edge)}
.brand img{height:58px;width:auto;display:block}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  all:unset;cursor:pointer;padding:12px 26px;background:transparent;border:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gray);transition:background .12s,color .12s,border-color .12s,box-shadow .12s;
}
.tab:hover,.tab[aria-selected="true"]{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28),inset 0 0 26px rgba(255,176,32,.10)}
.tab:focus-visible{outline:1px solid var(--gold-hi);outline-offset:2px}
.tab .n{font-family:'Barlow',sans-serif;font-weight:500;font-size:12px;color:var(--dim);margin-left:9px;letter-spacing:.04em}
.tab[aria-selected="true"] .n,.tab:hover .n{color:var(--gold)}

/* images switch */
.imgtoggle{margin-left:auto;display:flex;align-items:center;gap:11px;
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--dim);user-select:none;cursor:pointer}
.imgtoggle:hover{color:var(--gold-hi)}
.swtrack{position:relative;display:inline-block;width:42px;height:23px;flex:none}
.swtrack input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.swtrack .swpill{position:absolute;inset:0;background:transparent;border:1px solid var(--edge);transition:border-color .14s,box-shadow .14s}
.swtrack .swpill::before{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;
  background:var(--dim);transition:transform .14s,background .14s}
.swtrack input:checked+.swpill{border-color:var(--gold);box-shadow:0 0 10px rgba(255,176,32,.35)}
.swtrack input:checked+.swpill::before{transform:translateX(19px);background:var(--gold-hi)}
.swtrack input:focus-visible+.swpill{outline:1px solid var(--gold-hi);outline-offset:2px}
body.images-on .tile .bgimg,body.images-on .pc .bgimg{opacity:1}

/* ---------- tiles (home + campaigns) ---------- */
.home{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:26px}
.camprow{display:grid;grid-template-columns:1fr;gap:8px;margin-top:26px}
.tile{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:flex-start;
  background:#000;border:1px solid var(--edge);padding:26px;text-align:left;cursor:pointer;overflow:hidden;
  transition:border-color .14s,box-shadow .14s,background .14s;min-height:238px}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .14s;z-index:1;
  background:repeating-linear-gradient(to bottom,rgba(255,176,32,.07) 0 1px,transparent 1px 3px)}
.tile:hover,.tile:focus-visible{border-color:var(--gold);background:rgba(255,176,32,.07);
  box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(255,176,32,.28),inset 0 0 34px rgba(255,176,32,.10);outline:none}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
.tile:hover h3,.tile:focus-visible h3{color:var(--gold);text-shadow:0 0 18px rgba(255,176,32,.55)}
.tile:hover .aur,.tile:focus-visible .aur{color:var(--gold-hi);opacity:.75}
.tile:hover .foot,.tile:focus-visible .foot{color:var(--gold-hi);border-color:var(--gold)}
.tile:hover .when,.tile:focus-visible .when{color:var(--gold-hi)}
.tile .aur{font-family:'Aurebesh AF',sans-serif;font-size:12px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:5px;padding-right:230px;line-height:1.5;min-height:1.5em;transition:color .14s}
.tile h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1;transition:color .14s,text-shadow .14s;font-size:30px}
.tile .eyebrow{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);font-weight:500;display:block;margin-top:6px}
.tile p{margin:12px 0 20px;font-size:14.5px;color:var(--gray);line-height:1.55;max-width:46ch}
.tile .foot{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);border-top:1px solid var(--edge);padding-top:9px;margin-top:auto;
  display:flex;justify-content:space-between;gap:14px;transition:color .14s,border-color .14s}
.tile .aur,.tile h3,.tile .eyebrow,.tile p,.tile .foot,.tile .when{position:relative;z-index:2}
.tags{position:absolute;top:22px;right:26px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:3}
.tag{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);padding:3px 10px;white-space:nowrap}

/* the next-session tile */
.home .feature{grid-row:span 3;min-height:420px;justify-content:flex-end}
.home .feature h3{font-size:44px}
.home .feature p{font-size:16px}
.when{display:block;margin-top:14px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;
  font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--white);line-height:1.15;transition:color .14s}
.when small{display:block;font-weight:600;font-size:15px;letter-spacing:.16em;color:var(--dim);margin-top:4px}

/* tile background image (hover only) */
.tile .bgimg,.pc .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .18s;pointer-events:none;z-index:0}
.tile .bgimg::after,.pc .bgimg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,#000 0%,rgba(0,0,0,.94) 28%,rgba(0,0,0,.62) 58%,rgba(0,0,0,.30) 100%)}
.tile:hover .bgimg,.tile:focus-visible .bgimg,.pc:hover .bgimg,.pc:focus-visible .bgimg{opacity:1}

/* ---------- groups ---------- */
.groups{margin-top:26px;display:flex;flex-direction:column;gap:54px}
.sheetview .groups{margin-top:34px}
.grouphead{border-bottom:1px solid var(--edge);padding-bottom:11px;margin-bottom:14px}
.grouphead h2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:22px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--white);margin:0}
.sheetview .grouphead h2{font-size:22px;letter-spacing:.18em}

/* ---------- portrait cards (characters + sessions) ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.pc{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;cursor:pointer;aspect-ratio:3/4;min-height:280px;
  border:1px solid var(--edge);background:#000;
  transition:border-color .14s,box-shadow .14s}
.pc:hover,.pc:focus-visible{border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(255,176,32,.28)}
.pc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .14s;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(255,176,32,.07) 0 1px,transparent 1px 3px)}
.pc:hover::after,.pc:focus-visible::after{opacity:1}
.pc .txt{position:relative;z-index:3;padding:0 16px 15px}
.pc .aur{font-family:'Aurebesh AF',sans-serif;font-size:11px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:5px;line-height:1.5;transition:color .14s;padding-right:0}
.pc:hover .aur{color:var(--gold-hi);opacity:.8}
.pc h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1.02;transition:color .14s,text-shadow .14s}
.pc:hover h3,.pc:focus-visible h3{color:var(--gold);text-shadow:0 0 18px rgba(255,176,32,.55)}
.pc .eyebrow{display:block;margin-top:6px;font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.still{cursor:default}
.sheetview .pc .aur{font-size:11px;margin-bottom:5px;padding-right:0}
.sheetview .pc .eyebrow{font-size:12px;margin-top:6px;letter-spacing:.14em}

/* ---------- detail pages ---------- */
.detail{margin-top:26px}
.back{all:unset;cursor:pointer;padding:8px 18px;border:1px solid var(--edge);margin-bottom:8px;
  display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gray);
  transition:background .12s,color .12s,border-color .12s,box-shadow .12s}
.back:hover,.back:focus-visible{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28)}
.sheetview{border:1px solid var(--edge);background:#000;padding:38px 40px 34px;position:relative}
.sheetview .aur{font-family:'Aurebesh AF',sans-serif;font-size:14px;color:var(--dim);letter-spacing:.06em;
  display:block;margin-bottom:8px;padding-right:120px;line-height:1.5}
.sheetview h2{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:52px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--white);margin:0;line-height:1}
.sheetview .eyebrow{font-family:'Barlow Semi Condensed',sans-serif;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);font-weight:500;display:block;margin-top:10px}
.sheetview .lede{font-size:17px;color:var(--gray);line-height:1.6;margin:24px 0 0;max-width:70ch}
.sheetview .lede:empty{display:none}
.flag{position:absolute;top:38px;right:40px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.blankslate{margin-top:34px;padding-top:26px;border-top:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-size:14px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}

/* footer prompt bar */
.prompt{display:flex;align-items:center;gap:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--edge);
  font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.prompt i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border:1px solid var(--edge);border-radius:50%;font-size:11px;color:var(--gray)}

@media(max-width:860px){
  .wrap{padding:0 14px 50px}
  header{gap:14px}
  .brand{border-right:none;padding-right:0}
  .brand img{height:44px}
  nav{width:100%;overflow-x:auto}
  .tab{padding:10px 16px;font-size:14px;white-space:nowrap}
  .tab .n{display:none}
  .home,.camprow{grid-template-columns:1fr}
  .home .feature{grid-row:auto;min-height:340px}
  .home .feature h3{font-size:34px}
  .tile{min-height:0}
  .tile .aur{padding-right:0}
  .roster{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .pc{min-height:0}
  .pc h3{font-size:18px}
  .sheetview{padding:24px}
  .sheetview h2{font-size:32px}
  .sheetview .aur{padding-right:0}
  .flag{position:static;display:block;margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- edit mode ---------- */
.editbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 0;padding:12px 14px;
  border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.18)}
body.editing .editbar{display:flex}
.editflag{font-family:'Barlow Semi Condensed',sans-serif;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);margin-right:auto}
.ebtn{all:unset;cursor:pointer;padding:9px 18px;border:1px solid var(--edge);background:transparent;
  font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gray);transition:background .12s,color .12s,border-color .12s,box-shadow .12s}
.ebtn:hover,.ebtn:focus-visible{background:rgba(255,176,32,.07);color:var(--gold-hi);border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(255,176,32,.28)}
.ebtn.ghost{color:var(--dim)}
.ebtn[disabled]{opacity:.5;pointer-events:none}
.editbar input,.lock input,.tile .ein{background:transparent;border:1px solid var(--edge);color:var(--white);
  font-family:'Barlow',sans-serif;font-size:14px;padding:8px 11px;outline:none;color-scheme:dark}
.editbar input:focus,.lock input:focus,.tile .ein:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.editbar input{width:220px}
.tbtn{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--edge);background:#000;
  font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);transition:color .12s,border-color .12s}
.tbtn:hover,.tbtn:focus-visible{color:var(--gold-hi);border-color:var(--gold)}
.tools{display:none;position:absolute;top:12px;left:14px;z-index:5;gap:6px}
.tile .tools{top:22px;left:26px}
body.editing .tools{display:flex}
body.editing .tile{padding-top:64px}
body.editing .pc .txt{padding-top:40px}

/* every editable line: a faint dashed edge, solid gold while typing */
body.editing [data-f]{outline:1px dashed rgba(255,176,32,.38);outline-offset:3px;cursor:text;min-width:2ch;position:relative;z-index:4}
body.editing [data-f]:focus{outline:1px solid var(--gold);background:rgba(0,0,0,.6)}
body.editing [data-f]:empty::before{content:attr(data-ph);color:var(--dim);opacity:.7}
.tile p:empty{display:none}
body.editing .tile p:empty{display:block}
body.editing .tags{z-index:5}
.tags .tag:empty{display:none}
body.editing .tags .tag:empty{display:inline-block}
.tile select.tag{background:#000;cursor:pointer;outline:none;color-scheme:dark}
.whenedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;position:relative;z-index:4}
.whenedit .ein{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;padding:6px 10px}
.whenedit small{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tile .urlrow{position:relative;z-index:4;margin-top:14px;display:none}
body.editing .tile .urlrow{display:block}
.tile .urlrow .ein{width:100%}
.addcard{all:unset;box-sizing:border-box;display:none;align-items:center;justify-content:center;aspect-ratio:3/4;min-height:280px;
  border:1px dashed var(--edge);cursor:pointer;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;
  font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:color .12s,border-color .12s}
.addcard:hover,.addcard:focus-visible{color:var(--gold-hi);border-color:var(--gold)}
body.editing .addcard{display:flex}

/* unlock prompt */
.veil{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.86);
  align-items:flex-start;justify-content:center;padding:120px 18px}
.veil.open{display:flex}
.lock{width:100%;max-width:340px;background:#000;border:1px solid var(--edge);padding:20px}
.lock input{width:100%;font-size:15px;padding:10px 12px}
.lock .acts{display:flex;gap:6px;margin-top:10px}
.lock .ebtn{flex:1;text-align:center;padding:8px 0;font-size:13px}
.lockerr{margin:10px 0 0;font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);min-height:1em}
@media(max-width:860px){.editbar input{width:100%}}
</style>

/* ---------- time: the session is typed in one zone, shown in the viewer's ---------- */
function zoneOffset(ms, zone){
  const f = new Intl.DateTimeFormat('en-US', {timeZone:zone, hour12:false, year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value);
  return Date.UTC(+o.year, o.month-1, +o.day, +o.hour % 24, +o.minute, +o.second) - Math.floor(ms/1000)*1000;
}
function sessionMs(){
  const n = SITE.next, d = /^(\d{4})-(\d\d)-(\d\d)$/.exec(n.date||''), t = /^(\d\d):(\d\d)$/.exec(n.time||'');
  if (!d || !t) return NaN;
  const want = Date.UTC(+d[1], d[2]-1, +d[3], +t[1], +t[2]);
  let g = want;
  try { for (let i = 0; i < 3; i++) g = want - zoneOffset(g, n.tz || 'UTC'); } catch(e) {}
  return g;
}
function zoneName(){
  try { return new Intl.DateTimeFormat('en-US', {timeZone:SITE.next.tz, timeZoneName:'short'})
    .formatToParts(new Date(sessionMs() || Date.now())).find(p => p.type === 'timeZoneName').value } catch(e) { return SITE.next.tz }
}

      ${bg(c.homeImg || c.img)}${tools(`campaigns.${id}.homeImg`)}
      <span class="tags">${picker}</span>
      <span class="aur">${esc(c.title)}</span>
      <h3>${esc(c.title)}</h3>
      ${when}
    </div>
    <div class="tile" tabindex="0" data-go="campaigns">
      ${bg(h.campaigns.img)}${tools('home.campaigns.img')}
      <span class="aur">${esc(h.campaigns.title)}</span>
      ${F('home.campaigns.title', h.campaigns.title, 'h3', '', 'Title')}
      ${F('home.campaigns.eyebrow', h.campaigns.eyebrow, 'span', 'eyebrow', 'Subtitle')}
      <span class="foot"><span>${Object.keys(SITE.campaigns).length} campaigns</span><span>Browse</span></span>
    </div>
    <div class="tile" tabindex="0" data-go="characters">
      ${bg(h.characters.img)}${tools('home.characters.img')}
      <span class="aur">${esc(h.characters.title)}</span>
      ${F('home.characters.title', h.characters.title, 'h3', '', 'Title')}
      ${F('home.characters.eyebrow', h.characters.eyebrow, 'span', 'eyebrow', 'Subtitle')}
      <span class="foot"><span>${SITE.characters.length} on file</span><span>Browse</span></span>
    </div>
    <a class="tile" href="${esc(h.discord.url)}" target="_blank" rel="noopener">
      ${bg(h.discord.img)}${tools('home.discord.img')}
      <span class="aur">${esc(h.discord.title)}</span>
      ${F('home.discord.title', h.discord.title, 'h3', '', 'Title')}
      ${F('home.discord.eyebrow', h.discord.eyebrow, 'span', 'eyebrow', 'Subtitle')}
      <span class="urlrow"><input class="ein" data-v="home.discord.url" value="${esc(h.discord.url)}" placeholder="Discord invite link"></span>
      <span class="foot"><span>Comms</span><span>&#8599;</span></span>
    </a>
  </div>`;
}

function campaignsView(){
  return `<div class="camprow">${Object.entries(SITE.campaigns).map(([id,c]) => `
    <div class="tile" tabindex="0" data-go="campaigns/${id}">
      ${bg(c.img)}${tools(`campaigns.${id}.img`)}
      <span class="tags">${F(`campaigns.${id}.tag`, c.tag, 'span', 'tag', 'Tag')}</span>
      <span class="aur">${esc(c.title)}</span>
      ${F(`campaigns.${id}.title`, c.title, 'h3', '', 'Title')}
      ${F(`campaigns.${id}.eyebrow`, c.eyebrow, 'span', 'eyebrow', 'Subtitle')}
      ${F(`campaigns.${id}.blurb`, c.blurb, 'p', '', 'Description')}
      <span class="foot">${F(`campaigns.${id}.footL`, c.footL, 'span', '', 'Left')}${F(`campaigns.${id}.footR`, c.footR, 'span', '', 'Right')}</span>
    </div>`).join('')}</div>`;
}

function card(path, name, eyebrow, img, imgKey, delPath){
  return `<div class="pc still">
    ${bg(img)}${tools(`${path}.${imgKey}`, delPath)}
    <span class="txt">
      <span class="aur">${esc(name)}</span>
      ${F(`${path}.name`, name, 'h3', '', 'Name')}
      ${(eyebrow || editing()) ? F(`${path}.eyebrow`, eyebrow, 'span', 'eyebrow', 'Subtitle') : ''}
    </span>
  </div>`;
}

function campaignPage(id){
  const c = SITE.campaigns[id]; if (!c) return campaignsView();
  const ss = c.sessions || [];
  return `<div class="detail">
    <button class="back" data-go="campaigns">&larr; All campaigns</button>
    <div class="sheetview">
      ${c.tag ? `<div class="flag">${esc(c.tag)}</div>` : ''}
      <span class="aur">${esc(c.title)}</span>
      <h2>${esc(c.title)}</h2>
      <span class="eyebrow">${esc(c.eyebrow)}</span>
      <p class="lede">${esc(c.blurb)}</p>
      ${(ss.length || editing()) ? `<div class="groups"><section>
        <div class="grouphead"><h2>Sessions</h2></div>
        <div class="roster">
          ${ss.map((s,n) => card(`campaigns.${id}.sessions.${n}`, s.name, s.eyebrow, s.img, 'img', `campaigns.${id}.sessions.${n}`)).join('')}
          <button class="addcard" data-add="campaigns.${id}.sessions">+ Add session</button>
        </div>
      </section></div>` : '<div class="blankslate">No sessions logged yet.</div>'}

  </div>`;
}

function charactersView(){
  return `<div class="groups"><section>
    <div class="grouphead"><h2>Player characters</h2></div>
    <div class="roster">
      ${SITE.characters.map((i,n) => card(`characters.${n}`, i.name, i.eyebrow, i.portrait, 'portrait', `characters.${n}`)).join('')}
      <button class="addcard" data-add="characters">+ Add character</button>
    </div>
  </section></div>`;
}

function render(){
  const { tab, id } = route();
  [...nav.children].forEach(b => {
    b.setAttribute('aria-selected', b.dataset.k === tab);
    const label = TABS.find(t => t[0] === b.dataset.k)[1];
    b.innerHTML = b.dataset.k === 'characters'
      ? `${label}<span class="n">${String(SITE.characters.length).padStart(2,'0')}</span>` : label;
  });
  view.innerHTML =
    tab === 'campaigns' ? (id ? campaignPage(id) : campaignsView()) :
    tab === 'characters' ? charactersView() : homeView();
  const name = id && SITE.campaigns[id] ? SITE.campaigns[id].title : TABS.find(t => t[0] === tab)[1];
  document.title = `${name} — Star Wars`;
  document.getElementById('clock').textContent = `${SITE.characters.length} RECORDS ON FILE`;
}

/* ---------- data paths: "campaigns.the-mando-ade.title" ---------- */
function getAt(path){ return path.split('.').reduce((o,k) => o == null ? o : o[k], SITE); }
function setAt(path, v){
  const ks = path.split('.'), last = ks.pop();
  const o = ks.reduce((o,k) => o[k], SITE);
  o[last] = v;
}
function markDirty(){ dirty = true; document.getElementById('editFlag').textContent = 'Unsaved changes · Publish when ready'; }

/* ---------- clicks ---------- */
view.addEventListener('click', e => {
  const t = e.target;
  if (editing()){
    const img = t.closest('[data-img]');
    if (img){ e.preventDefault(); pickImage(img.dataset.img); return; }
    const del = t.closest('[data-del]');
    if (del){
      e.preventDefault();
      const ks = del.dataset.del.split('.'), n = +ks.pop(), list = getAt(ks.join('.'));
      if (confirm(`Remove "${list[n].name || 'this card'}"?`)){ list.splice(n,1); markDirty(); render(); }
      return;
    }
    const add = t.closest('[data-add]');
    if (add){
      const list = getAt(add.dataset.add);
      list.push(add.dataset.add === 'characters' ? {name:'', eyebrow:'', portrait:''} : {name:'', eyebrow:'', img:''});
      markDirty(); render();
      const cards = view.querySelectorAll('.pc h3[data-f]'); const last = cards[cards.length-1];
      if (last) last.focus();
      return;
    }
    // typing in a field never follows the tile it sits on
    if (t.closest('[data-f],[data-v],.tools')){ e.preventDefault(); return; }
  }
  const el = t.closest('[data-go]'); if (!el) return;
  const [tab, id] = el.dataset.go.split('/');
  go(tab, id); window.scrollTo(0, 0);
});
view.addEventListener('keydown', e => {
  if (e.target.matches('[data-f]')){ if (e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } return; }
  if (e.key === 'Enter' && e.target.matches('[data-go]')) e.target.click();
});

/* ---------- typing ---------- */
view.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-f]')){
    setAt(t.dataset.f, t.textContent.trim());
    // keep the aurebesh line above a title in step with it
    if (/\.(title|name)$/.test(t.dataset.f)){
      const a = t.closest('.tile,.pc')?.querySelector('.aur'); if (a){ a.textContent = t.textContent; a.dataset.text = t.textContent; }
    }
    markDirty();
  } else if (t.matches('[data-v]')){
    setAt(t.dataset.v, t.value.trim()); markDirty();
  }
});
view.addEventListener('change', e => {
  if (e.target.matches('select[data-v]')) render();
  if (e.target.matches('[data-v="home.discord.url"]')) e.target.closest('a').href = e.target.value;
});

/* ---------- images: picked, shrunk, kept in the page until publish moves them to images/ ---------- */
let imgTarget = null;
const imgPick = document.getElementById('imgPick');
function pickImage(path){ imgTarget = path; imgPick.value = ''; imgPick.click(); }
imgPick.onchange = () => {
  const f = imgPick.files[0]; if (!f || !imgTarget) return;
  const im = new Image();
  im.onload = () => {
    const sc = Math.min(1, 1400 / im.width), c = document.createElement('canvas');
    c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    setAt(imgTarget, c.toDataURL('image/jpeg', .82));
    URL.revokeObjectURL(im.src); markDirty(); render();
  };
  im.src = URL.createObjectURL(f);
};

/* ---------- unlock: Ctrl + Shift + E ---------- */
const veil = document.getElementById('veil');
async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function closeVeil(){ veil.classList.remove('open'); veil.innerHTML = ''; }
function promptUnlock(){
  if (editing()) return;
  veil.innerHTML = `<div class="lock">
    <input type="password" id="pw" autocomplete="off" aria-label="Password">
    <div class="acts"><button class="ebtn" id="pwGo">Unlock</button><button class="ebtn ghost" id="pwNo">Cancel</button></div>
    <p class="lockerr" id="pwErr"></p></div>`;
  veil.classList.add('open');
  const pw = document.getElementById('pw'); pw.focus();
  const tryIt = async () => {
    if (await sha256(pw.value) === PASS_HASH){ document.body.classList.add('editing'); closeVeil(); render(); }
    else document.getElementById('pwErr').textContent = 'Password not recognised.';
  };
  document.getElementById('pwGo').onclick = tryIt;
  document.getElementById('pwNo').onclick = closeVeil;
  pw.onkeydown = e => { if (e.key === 'Enter') tryIt(); };
}
veil.addEventListener('mousedown', e => { if (e.target === veil) closeVeil(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeVeil();
  if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')){ e.preventDefault(); promptUnlock(); }
});
document.getElementById('lockBtn').onclick = () => {
  if (dirty && !confirm('There are unpublished changes. Lock anyway? They stay on this page until you reload.')) return;
  document.body.classList.remove('editing'); render();
};
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- saving ---------- */
function buildFile(){
  const a = SRC.indexOf('/*DATA*/'), b = SRC.indexOf('/*END DATA*/');
  if (a < 0 || b < 0) throw new Error('Could not find the data block in the page.');
  return SRC.slice(0, a) + '/*DATA*/\nconst SITE = ' + JSON.stringify(SITE, null, 2) + ';\n' + SRC.slice(b);
}
document.getElementById('dlBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildFile()], {type:'text/html'}));
  a.download = 'index.html'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

const tokIn = document.getElementById('tok');
tokIn.value = sessionStorage.getItem('ghToken') || '';
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
async function commit(tok, path, content, message){
  const api = `https://api.github.com/repos/${REPO}/contents/${path}`;
  const h = {Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json'};
  let sha = null;
  const meta = await fetch(`${api}?ref=${BRANCH}`, {headers: h});
  if (meta.ok) sha = (await meta.json()).sha;
  else if (meta.status !== 404) throw new Error(`GitHub refused the token (${meta.status}).`);
  const put = await fetch(api, {method:'PUT', headers:h, body: JSON.stringify({message, content, branch:BRANCH, ...(sha ? {sha} : {})})});
  if (!put.ok){ let d = ''; try { d = (await put.json()).message } catch(e) {} throw new Error(`Could not save ${path} (${put.status}) ${d}`); }
}
// any picked image still living inside the page is moved out to images/
function embeddedImages(){
  const out = [], slug = s => String(s||'image').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'image';
  (function walk(o, path){
    for (const k in o){
      const v = o[k], p = path ? path + '.' + k : k;
      if (typeof v === 'string' && v.startsWith('data:image/')) {
        const hint = o.name || o.title || path.split('.').filter(x => isNaN(x)).pop() || 'image';
        out.push({p, data: v, file: `images/${slug(hint)}-${k === 'portrait' ? 'portrait' : k}-${Date.now().toString(36)}${out.length}.jpg`});
      } else if (v && typeof v === 'object') walk(v, p);
    }
  })(SITE, '');
  return out;
}
document.getElementById('pubBtn').onclick = async () => {
  const btn = document.getElementById('pubBtn'), flag = document.getElementById('editFlag');
  const tok = tokIn.value.trim();
  if (!tok){ tokIn.focus(); flag.textContent = 'Paste your GitHub token first'; return; }
  btn.disabled = true;
  try {
    const imgs = embeddedImages();
    for (let i = 0; i < imgs.length; i++){
      flag.textContent = `Uploading image ${i+1} of ${imgs.length}…`;
      await commit(tok, imgs[i].file, imgs[i].data.split(',')[1], 'Add image');
      setAt(imgs[i].p, imgs[i].file);
    }
    flag.textContent = 'Saving page…';
    await commit(tok, FILE_PATH, b64(new TextEncoder().encode(buildFile())), 'Update site');
    sessionStorage.setItem('ghToken', tok);
    dirty = false; flag.textContent = 'Published · live in about a minute';
  } catch(err){ flag.textContent = err.message; }
  btn.disabled = false;
};

/* ---------- aurebesh scramble on hover ---------- */
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function scramble(el){
  if (reduced || editing() || el.dataset.busy) return;
  const target = el.dataset.text || el.textContent;
  el.dataset.text = target; el.dataset.busy = "1";
  const len = target.length; let frame = 0;
  const settle = target.split('').map((_,i) => 6 + Math.floor(i*1.6 + Math.random()*6));
  const held = target.split('').map(() => GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
  el._scr = setInterval(() => {
    let out = '';
    for (let i = 0; i < len; i++){
      const ch = target[i];
      if (ch === ' ' || frame >= settle[i]){ out += ch; continue }
      if (frame % 4 === 0) held[i] = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      out += held[i];
    }
    el.textContent = out;
    if (frame++ > Math.max(...settle)) stopScramble(el);
  }, 35);
}
function stopScramble(el){
  if (!el || !el._scr) return;
  clearInterval(el._scr); el._scr = null;
  el.textContent = el.dataset.text || el.textContent;
  delete el.dataset.busy;
}
view.addEventListener('mouseover', e => {
  const c = e.target.closest('.tile,.pc'); if (!c || c.contains(e.relatedTarget)) return;
  const a = c.querySelector('.aur'); if (a) scramble(a);
});
view.addEventListener('mouseout', e => {
  const c = e.target.closest('.tile,.pc'); if (!c || c.contains(e.relatedTarget)) return;
  stopScramble(c.querySelector('.aur'));
});

document.getElementById('imgToggle').addEventListener('change', e => document.body.classList.toggle('images-on', e.target.checked));
window.addEventListener('hashchange', render);
render();
</script></body></html>
